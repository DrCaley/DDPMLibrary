[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpm-library"
version = "0.9.0"
description = "Inference-only ocean velocity inpainting library built around a split-head DDPM."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "DDPMLibrary contributors" }
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",   # GP baseline only
  "torch>=2.0",
]
keywords = [
  "ddpm",
  "diffusion",
  "oceanography",
  "pytorch",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ddpm_library*"]

[tool.setuptools.package-data]
ddpm_library = ["assets/*.pt", "assets/*.npz"]

[tool.pytest.ini_options]
# So `pytest` works from a clean checkout without `pip install -e .` first.
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # The suite samples tiny ensembles (n_draws 2-5) to stay fast, which trips the
    # sampling-configuration calibration guard on nearly every predictor test. The
    # guard is asserted directly in tests/test_calibration_ensemble.py; ignoring it
    # here keeps the rest of the output readable without hiding any other warning.
    "ignore:.*the factor was fitted at.*:RuntimeWarning",
]
